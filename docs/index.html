<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pražec</title>
<meta name="description" content="Ladička, akordy, zpěvník a trénink na kytaru.">
<meta name="theme-color" content="#1b1713" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef0ea" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pražec">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>/* Layout: phone-first workbench — compact header, one content column, thumb-reach tab bar at the bottom (top bar from 900px) */
:root{
  --bg:#1b1713; --surface:#25201a; --surface-2:#2f2820; --line:#3d3429;
  --fg:#f0e7d8; --muted:#b3a691; --accent:#e2b04e; --accent-ink:#1b1713;
  --string:#cfd2d6; --fret:#8d7c63; --sheet:rgba(0,0,0,.55);
  --lv0:#c46454; --lv1:#d08a3a; --lv2:#b9b245; --lv3:#5fae7a;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --nav-h:64px; --lyr:1.05rem;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef0ea; --surface:#f8f9f5; --surface-2:#e3e6dd; --line:#cdd2c5;
  --fg:#1f2420; --muted:#5d655c; --accent:#9a6a10; --accent-ink:#fff;
  --string:#6c7178; --fret:#9c9a8e; --sheet:rgba(20,24,20,.35);
  --lv0:#b24a3c; --lv1:#b86f1c; --lv2:#8a8420; --lv3:#2f8a52; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef0ea; --surface:#f8f9f5; --surface-2:#e3e6dd; --line:#cdd2c5;
  --fg:#1f2420; --muted:#5d655c; --accent:#9a6a10; --accent-ink:#fff;
  --string:#6c7178; --fret:#9c9a8e; --sheet:rgba(20,24,20,.35);
  --lv0:#b24a3c; --lv1:#b86f1c; --lv2:#8a8420; --lv3:#2f8a52; color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.muted{color:var(--muted)}
.small-t{font-size:.86rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:calc(14px + env(safe-area-inset-top,0px)) 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.save-note{font-size:.75rem;color:var(--muted);text-align:right;max-width:16em}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px))}
nav.tabs a{display:grid;justify-items:center;gap:2px;padding:8px 2px 6px;min-height:var(--nav-h);color:var(--muted);text-decoration:none;font-size:.72rem;font-weight:700}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
@media (min-width:900px){
  body{padding-block:0 48px}
  nav.tabs{position:static;display:flex;gap:4px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:0;margin-bottom:24px;max-width:980px;margin-inline:auto}
  nav.tabs a{display:flex;gap:8px;align-items:center;min-height:0;padding:10px 14px;font-size:1rem;font-family:var(--f-display);border-bottom:3px solid transparent;margin-bottom:-1px}
  nav.tabs a svg{width:20px;height:20px}
  nav.tabs a[aria-current="page"]{color:var(--fg);border-color:var(--accent)}
}
section.view{display:grid;gap:18px;padding-top:6px}
.lead{max-width:62ch;color:var(--muted)}
.sub{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:4px;overflow-x:auto;scrollbar-width:none}
.sub button{flex:1 0 auto;border:0;background:transparent;border-radius:7px;padding:8px 12px;font-weight:700;color:var(--muted);white-space:nowrap}
.sub button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);padding:8px 14px;border-radius:9px;font-weight:700;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:4px 10px;font-size:.875rem}
.btn.danger{color:var(--lv0)}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.notice{border-left:3px solid var(--accent);padding:8px 12px;background:var(--surface);border-radius:0 8px 8px 0;font-size:.9rem}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
label.inline{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--fg)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--fg);min-width:0;font-size:16px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
input[type=range]{accent-color:var(--accent);padding:0;border:0;background:transparent}
textarea{min-height:240px;font-family:var(--f-mono);font-size:14px;line-height:1.5;resize:vertical}
.empty{border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}

/* tuner */
.tuner{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.tuner{grid-template-columns:1fr}}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px;justify-items:center;text-align:center}
.meter svg{width:100%;max-width:340px;height:auto}
.note-big{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1}
.cents{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.hint{font-family:var(--f-display);font-weight:700;font-size:1.1rem;min-height:1.4em}
.headstock{display:grid;gap:6px}
.str{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:left;min-height:52px}
.str:hover,.str.on{border-color:var(--accent)}
.str.target{border-color:var(--lv3)}
.str b{font-family:var(--f-display);font-size:1.35rem}
.str .wire{height:var(--w,2px);background:var(--string);border-radius:2px}
.str.on .wire{animation:vib .08s linear infinite}
@keyframes vib{50%{transform:translateY(1.5px)}}
.str span{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* chords */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.875rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;justify-items:center}
.card .name{font-family:var(--f-display);font-weight:800;font-size:1.4rem;line-height:1}
.card .alias{font-size:.72rem;color:var(--muted);min-height:1.1em}
.card .dg{width:100%;max-width:120px;cursor:pointer}
.card .dg svg,.dg svg{width:100%;height:auto;display:block}
.lvl{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;width:100%}
.lvl button{height:32px;border:1px solid var(--line);background:transparent;border-radius:6px;font-size:.8rem;padding:0;color:var(--muted)}
.lvl button[aria-pressed="true"]{color:#fff;border-color:transparent}
.lvl button[data-l="0"][aria-pressed="true"]{background:var(--lv0)}
.lvl button[data-l="1"][aria-pressed="true"]{background:var(--lv1)}
.lvl button[data-l="2"][aria-pressed="true"]{background:var(--lv2)}
.lvl button[data-l="3"][aria-pressed="true"]{background:var(--lv3)}
.lvl-label{font-size:.72rem;color:var(--muted);text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* songs */
.songs{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.songs{grid-template-columns:1fr}.songs.reading .song-col{display:none}.songs:not(.reading) .pane-col{display:none}}
.song-col{display:grid;gap:8px}
.song-list{display:grid;gap:6px}
.song-item{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:grid;gap:2px;width:100%}
.song-item[aria-current="true"]{border-color:var(--accent)}
.song-item b{font-family:var(--f-display);font-size:1.05rem}
.song-item small{color:var(--muted)}
.tag{display:inline-block;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.done{border-color:var(--lv3);color:var(--lv3)}
.tag.ex{border-color:var(--accent);color:var(--accent)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;min-width:0}
.sheet-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toolbar .grp{display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:9px;padding:2px}
.toolbar .grp button{border:0;background:transparent;min-width:36px;height:36px;border-radius:7px;font-weight:700}
.toolbar .grp button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toolbar .grp span{font-family:var(--f-mono);font-size:.78rem;padding:0 6px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.suggest{font-size:.9rem;background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.lyrics{font-size:var(--lyr);overflow-x:auto}
.line{display:flex;flex-wrap:wrap;align-items:flex-end;min-height:1.6em;margin-bottom:4px}
.seg{display:inline-flex;flex-direction:column;white-space:pre}
.seg .ch{font-family:var(--f-mono);font-weight:700;color:var(--accent);font-size:.88em;min-height:1.3em;padding-right:6px;cursor:pointer}
.line.nochords .seg .ch{display:none}
.line.head{font-family:var(--f-display);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;margin-top:10px}
.used{display:grid;grid-auto-flow:column;grid-auto-columns:78px;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.used .mini{display:grid;justify-items:center;gap:2px;background:var(--surface-2);border-radius:10px;padding:6px;cursor:pointer}
.used .mini b{font-family:var(--f-display);font-size:.95rem}
.used .mini .dot{width:8px;height:8px;border-radius:50%}
@media (min-width:761px){.back-btn{display:none!important}}
.fields{display:grid;grid-template-columns:2fr 2fr 1fr 1fr;gap:10px}
@media (max-width:600px){.fields{grid-template-columns:1fr 1fr}}
.scroll-fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.scroll-fab button{border:0;background:transparent;width:40px;height:40px;border-radius:50%;font-weight:800}
.scroll-fab button.go{background:var(--accent);color:var(--accent-ink)}
.scroll-fab span{font-family:var(--f-mono);font-size:.78rem;min-width:2ch;text-align:center}
@media (min-width:900px){.scroll-fab{bottom:24px}}

/* bottom sheet */
.sheet-bg{position:fixed;inset:0;background:var(--sheet);z-index:40;display:grid;align-items:end;justify-items:center}
.bsheet{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:88vh;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
@media (min-width:700px){.sheet-bg{align-items:center}.bsheet{border-radius:18px}}
.bsheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);justify-self:center}
.chord-pop{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.chord-pop .name{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1}
.preview{max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}

/* practice */
.drill{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:640px){.drill{grid-template-columns:1fr}}
.drill-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;justify-items:center;gap:10px}
.drill-card .name{font-family:var(--f-display);font-weight:800;font-size:3.6rem;line-height:1}
.drill-card .dg{width:100%;max-width:180px}
.timer{font-family:var(--f-mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.pair .dg{max-width:130px;justify-self:center;width:100%}
.big-tap{width:100%;min-height:120px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:1.4rem;display:grid;place-items:center;gap:2px}
.big-tap b{font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.big-tap:disabled{background:var(--surface-2);color:var(--muted)}
.countdown{font-family:var(--f-mono);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}

.metro{display:grid;gap:16px}
.bpm{display:flex;align-items:baseline;justify-content:center;gap:8px}
.bpm b{font-family:var(--f-display);font-size:4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.beats{display:flex;gap:8px;justify-content:center}
.beats i{width:18px;height:18px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line)}
.beats i.acc{border-color:var(--accent)}
.beats i.on{background:var(--accent);border-color:var(--accent)}
.pattern{display:grid;grid-template-columns:repeat(var(--n,8),1fr);gap:4px}
.pattern div{display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:8px;background:var(--surface-2);font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.pattern div b{font-size:1.4rem;line-height:1;color:var(--fg);min-height:1em}
.pattern div.on{background:var(--accent);color:var(--accent-ink)}
.pattern div.on b{color:var(--accent-ink)}

/* progress */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border-top:3px solid var(--line);padding-top:8px}
.stat b{display:block;font-family:var(--f-display);font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.bar i{display:block;height:100%}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.days div{aspect-ratio:1;border-radius:4px;background:var(--surface-2);max-width:100%}
.days div[data-n]{background:color-mix(in srgb,var(--accent) calc(30% + var(--k)*70%),var(--surface-2))}
.days-l{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.76rem;color:#fff;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-weight:700;font-size:.92rem;max-width:calc(100% - 32px)}
svg text{font-family:var(--f-mono)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 40 40" aria-hidden="true">
        <rect x="4" y="6" width="32" height="28" rx="4" fill="var(--surface-2)" stroke="var(--line)"/>
        <g stroke="var(--fret)" stroke-width="2"><line x1="4" y1="15" x2="36" y2="15"/><line x1="4" y1="24" x2="36" y2="24"/></g>
        <g stroke="var(--string)" stroke-width="1.2"><line x1="10" y1="6" x2="10" y2="34"/><line x1="16" y1="6" x2="16" y2="34"/><line x1="22" y1="6" x2="22" y2="34"/><line x1="28" y1="6" x2="28" y2="34"/></g>
        <circle cx="22" cy="19.5" r="3.6" fill="var(--accent)"/>
      </svg>
      <h1>Pražec</h1>
    </div>
    <p class="save-note" id="saveNote">Načítám…</p>
  </header>
</div>

<script>/* Pražec: hudební logika bez DOM (akordy, transpozice, import textu) */
const Music=(()=>{
"use strict";
const NOTES=["C","C#","D","D#","E","F","F#","G","G#","A","B","H"];
const STD=[40,45,50,55,59,64];
const TUNINGS={
  standard:{name:"Standardní (E A D G H e)",midi:[40,45,50,55,59,64],names:["E","A","D","G","H","e"]},
  dropd:{name:"Drop D (D A D G H e)",midi:[38,45,50,55,59,64],names:["D","A","D","G","H","e"]},
  half:{name:"O půltón níž (Es As Des Ges B es)",midi:[39,44,49,54,58,63],names:["Es","As","Des","Ges","B","es"]},
  dadgad:{name:"DADGAD",midi:[38,45,50,55,57,62],names:["D","A","D","G","A","d"]},
  openg:{name:"Open G (D G D G H d)",midi:[38,43,50,55,59,62],names:["D","G","D","G","H","d"]}
};
const LEVELS=["Neumím","Učím se","Jde to","Sedí"];
// pražce od basové E po tenkou e; -1 = nehraje; barre = [pražec, od struny, po strunu]
const CHORDS=[
 ["Em",[0,2,2,0,0,0],"zaklad"],["Am",[-1,0,2,2,1,0],"zaklad"],["C",[-1,3,2,0,1,0],"zaklad"],["G",[3,2,0,0,0,3],"zaklad"],
 ["D",[-1,-1,0,2,3,2],"zaklad"],["E",[0,2,2,1,0,0],"zaklad"],["A",[-1,0,2,2,2,0],"zaklad"],["Dm",[-1,-1,0,2,3,1],"zaklad"],
 ["E7",[0,2,0,1,0,0],"sept"],["A7",[-1,0,2,0,2,0],"sept"],["D7",[-1,-1,0,2,1,2],"sept"],["G7",[3,2,0,0,0,1],"sept"],
 ["C7",[-1,3,2,3,1,0],"sept"],["H7",[-1,2,1,2,0,2],"sept"],["Am7",[-1,0,2,0,1,0],"sept"],["Em7",[0,2,2,0,3,0],"sept"],
 ["Dm7",[-1,-1,0,2,1,1],"sept"],["Cmaj7",[-1,3,2,0,0,0],"sept"],["Fmaj7",[-1,-1,3,2,1,0],"sept"],["Dmaj7",[-1,-1,0,2,2,2],"sept"],
 ["Amaj7",[-1,0,2,1,2,0],"sept"],
 ["F",[1,3,3,2,1,1],"barre",[1,0,5]],["Fm",[1,3,3,1,1,1],"barre",[1,0,5]],["Hm",[-1,2,4,4,3,2],"barre",[2,1,5]],
 ["F#m",[2,4,4,2,2,2],"barre",[2,0,5]],["F#",[2,4,4,3,2,2],"barre",[2,0,5]],["Gm",[3,5,5,3,3,3],"barre",[3,0,5]],
 ["Cm",[-1,3,5,5,4,3],"barre",[3,1,5]],["H",[-1,2,4,4,4,2],"barre",[2,1,5]],["B",[-1,1,3,3,3,1],"barre",[1,1,5]],
 ["C#m",[-1,4,6,6,5,4],"barre",[4,1,5]],["G#m",[4,6,6,4,4,4],"barre",[4,0,5]],
 ["Dsus2",[-1,-1,0,2,3,0],"sus"],["Dsus4",[-1,-1,0,2,3,3],"sus"],["Asus2",[-1,0,2,2,0,0],"sus"],["Asus4",[-1,0,2,2,3,0],"sus"],
 ["Esus4",[0,2,2,2,0,0],"sus"],["Cadd9",[-1,3,2,0,3,0],"sus"],["G6",[3,2,0,0,0,0],"sus"],["Am/G",[3,0,2,2,1,0],"sus"]
];
const CATS=[["vse","Všechny"],["zaklad","Základní"],["sept","Septakordy a maj7"],["barre","Barré"],["sus","Sus, add a další"]];
const ALIAS={Hm:"Bm",H7:"B7",H:"B",B:"Bb"};
const DICT={};CHORDS.forEach(([n,f,c,b])=>DICT[n]={name:n,frets:f,cat:c,barre:b||null});

const Q_OK=/^(?:maj|min|mi|m|M|dim|aug|sus|add|no|[0-9]|\+|-|°|ø|\(|\)|b|#|,)*$/;
function parseChord(s){
  if(typeof s!=="string") return null;
  s=s.trim(); const m=/^([A-H])(.*)$/.exec(s); if(!m) return null;
  let r=m[1]==="B"?10:NOTES.indexOf(m[1]),rest=m[2];
  if(m[1]==="B"&&rest.startsWith("b")&&!/^b(?:5|9|13)/.test(rest)) rest=rest.slice(1);
  else   if(rest.startsWith("#")||rest.startsWith("is")&&m[1]!=="H"){r++;rest=rest.slice(rest[0]==="#"?1:2)}
  else if(rest.startsWith("b")&&!/^b(?:5|9|13)/.test(rest)){r--;rest=rest.slice(1)}
  else if(rest.startsWith("es")&&m[1]!=="E"&&m[1]!=="A"){r--;rest=rest.slice(2)}
  else if((m[1]==="E"||m[1]==="A")&&rest.startsWith("s")&&!rest.startsWith("sus")){r--;rest=rest.slice(1)}
  let bass=null; const sl=rest.indexOf("/");
  if(sl>=0){const b=parseChord(rest.slice(sl+1)); if(!b||b.q) return null; bass=b.root; rest=rest.slice(0,sl)}
  if(!Q_OK.test(rest)) return null;
  return {root:(r+12)%12,q:rest,bass};
}
const isChord=s=>!!parseChord(s);
function fmt(p){return NOTES[p.root]+p.q+(p.bass!=null?"/"+NOTES[p.bass]:"")}
function normName(s){const p=parseChord(s);return p?fmt(p):s}
function qNorm(q){
  if(/^(mi|min|-)$/.test(q)) return "m";
  if(/^(mi7|min7|-7)$/.test(q)) return "m7";
  if(/^(maj7|M7|7maj|maj)$/.test(q)) return q==="maj"?"":"maj7";
  if(q==="sus") return "sus4";
  return q;
}
// když tvar neznám, zjednoduším na příbuzný
const SIMPLER={"9":"7","7sus4":"7","6":"","add9":"","add2":"","m6":"m","m9":"m7","maj9":"maj7","5":"","13":"7","11":"7","m11":"m7","7b9":"7","aug":"","dim":"m","dim7":"m","sus2":"sus2"};
const SHAPES={
  E:{"":[0,2,2,1,0,0],m:[0,2,2,0,0,0],"7":[0,2,0,1,0,0],m7:[0,2,0,0,0,0],maj7:[0,-1,1,1,0,-1],sus4:[0,2,2,2,0,0]},
  A:{"":[-1,0,2,2,2,0],m:[-1,0,2,2,1,0],"7":[-1,0,2,0,2,0],m7:[-1,0,2,0,1,0],maj7:[-1,0,2,1,2,0],sus4:[-1,0,2,2,3,0],sus2:[-1,0,2,2,0,0]}
};
function getChord(name){
  const p=parseChord(name); if(!p) return null;
  const full=fmt(p); if(DICT[full]) return DICT[full];
  let q=qNorm(p.q),simplified=false;
  const base=NOTES[p.root]+q;
  if(DICT[base]) return {...DICT[base],name:full,bassNote:p.bass!=null?NOTES[p.bass]:null};
  if(!(q in SHAPES.E)&&!(q in SHAPES.A)){ if(q in SIMPLER){q=SIMPLER[q];simplified=true} else return null }
  if(DICT[NOTES[p.root]+q]) return {...DICT[NOTES[p.root]+q],name:full,simplified,bassNote:p.bass!=null?NOTES[p.bass]:null};
  const opts=[];
  if(SHAPES.E[q]) opts.push(["E",(p.root-4+12)%12]);
  if(SHAPES.A[q]) opts.push(["A",(p.root-9+12)%12]);
  opts.sort((a,b)=>a[1]-b[1]);
  const [shape,f]=opts[0];
  const frets=SHAPES[shape][q].map(x=>x<0?-1:x+f);
  const barre=f>0&&q!=="maj7"?[f,shape==="A"?1:0,5]:null;
  return {name:full,frets,cat:"gen",barre,simplified,bassNote:p.bass!=null?NOTES[p.bass]:null};
}
function difficulty(ch){if(!ch) return 5; if(ch.cat==="gen") return ch.barre?3.5:2.5; if(ch.cat==="barre") return 3; return ch.cat==="zaklad"?1:1.5}
function transpose(s,st){const p=parseChord(s); if(!p||!st) return p?fmt(p):s;
  return fmt({root:(p.root+st+120)%12,q:p.q,bass:p.bass!=null?(p.bass+st+120)%12:null})}
const midiFreq=m=>440*Math.pow(2,(m-69)/12);
const midiName=m=>NOTES[m%12]+(Math.floor(m/12)-1);

function chordsIn(text){const s=[];(text||"").replace(/\[([^\]]+)\]/g,(_,c)=>{c=c.trim();if(isChord(c)&&!s.includes(c)) s.push(c)});return s}

/* ---- import textu z webu ---- */
const DECOR=/^(\|+|\/+|-+|:+|%|x\d+|\d+x|\(x?\d+x?\)|\.+|N\.?C\.?|\*+)$/i;
function chordTokens(line){
  const out=[];let any=false,re=/\S+/g,m;
  while((m=re.exec(line))){
    let t=m[0],off=0;
    if(DECOR.test(t)) continue;
    const lead=/^[(|[]+/.exec(t); if(lead){off=lead[0].length;t=t.slice(off)}
    t=t.replace(/[)|\],.:]+$/,"");
    if(!t) continue;
    if(!isChord(t)) return null;
    out.push({pos:m.index+off,name:t});any=true;
  }
  return any?out:null;
}
const HEAD_ONLY=/^\s*[\[(]?\s*((?:ref(?:r[eé]n)?|rf|r|chorus|verse|sloka|intro|outro|bridge|mezihra|předehra|predehra|dohra|coda|solo|pre-chorus|interlude)\s*\d*|\d+)\s*[\])]?\s*[.:)]?\s*$/i;
const HEAD_PREFIX=/^\s*((?:ref(?:r[eé]n)?|rf|r|chorus|verse|sloka)\s*\d*|\d+)\s*[.:)]\s+(?=\S)/i;
const LABELS={r:"Refrén",rf:"Refrén",ref:"Refrén","refrén":"Refrén",refren:"Refrén",chorus:"Refrén",verse:"Sloka",sloka:"Sloka",intro:"Předehra","předehra":"Předehra",predehra:"Předehra",outro:"Dohra",dohra:"Dohra",bridge:"Mezihra",mezihra:"Mezihra",interlude:"Mezihra",solo:"Sólo",coda:"Dohra","pre-chorus":"Předrefrén"};
function label(raw){
  const m=/^([^\d\s]*)\s*(\d*)$/.exec(raw.trim().toLowerCase().replace(/\.$/,""));
  if(!m) return raw;
  if(!m[1]) return m[2]+". sloka";
  const l=LABELS[m[1]]||raw.trim();
  return m[2]?l+" "+m[2]:l;
}
function englishToCzech(name){
  const p=/^B(b|#)?(.*)$/.exec(name); if(!p) return name;
  if(p[1]==="b") return "B"+p[2];
  if(p[1]==="#") return "C"+p[2];
  return "H"+p[2];
}
function importText(raw,opt){
  opt=opt||{};
  let title=opt.title||"",artist=opt.artist||"";
  let t=String(raw||"").replace(/\r\n?/g,"\n").replace(/ /g," ");
  t=t.split("\n").map(l=>{let o="";for(const c of l){if(c==="\t"){o+=" ".repeat(8-o.length%8)}else o+=c}return o}).join("\n");
  // r.jina.ai hlavička
  const jt=/^Title:\s*(.+)$/m.exec(t); if(jt&&!title) title=jt[1].trim();
  t=t.replace(/^(Title|URL Source|Published Time|Markdown Content|Warning):.*$/gm,"");
  // Ultimate Guitar značky
  t=t.replace(/\[ch\]([^\[]*?)\[\/ch\]/g,"$1").replace(/\[\/?tab\]/g,"");
  // největší blok kódu s akordy (markdown)
  const blocks=[...t.matchAll(/```[^\n]*\n([\s\S]*?)```/g)].map(m=>m[1]).filter(b=>b.split("\n").some(l=>chordTokens(l)));
  if(blocks.length) t=blocks.sort((a,b)=>b.length-a.length)[0];
  let lines=t.split("\n").map(l=>l.replace(/\s+$/,""));
  // název z první řádky "Interpret - Název"
  if(!title){
    const i=lines.findIndex(l=>l.trim());
    if(i>=0){const l=lines[i].trim(),m=/^(.{1,60}?)\s+[-–—]\s+(.{1,60})$/.exec(l);
      if(m&&!chordTokens(l)&&!/\[/.test(l)){artist=m[1].trim();title=m[2].trim();lines.splice(i,1)}}
  } else if(/\s[-–—]\s/.test(title)&&!artist){
    const m=/^(.+?)\s+[-–—]\s+(.+?)(?:\s+[-–|—].*)?$/.exec(title); if(m){artist=m[1].trim();title=m[2].trim()}
  }
  title=title.replace(/\s*[(\[]?(akordy|chords?|text|tab|ver\.?\s*\d+)[)\]]?.*$/i,"").replace(/\s+[@|].*$/,"").trim();
  // anglické B?
  const allTok=[];lines.forEach(l=>{const c=chordTokens(l);if(c) c.forEach(x=>allTok.push(x.name));(l.match(/\[([^\]]+)\]/g)||[]).forEach(x=>allTok.push(x.slice(1,-1)))});
  const hasH=allTok.some(x=>/^H/.test(x)),hasB=allTok.some(x=>/^B(?!b)/.test(x));
  const english=opt.englishB!=null?opt.englishB:(hasB&&!hasH);
  const conv=n=>english?englishToCzech(n):n;
  const out=[];
  for(let i=0;i<lines.length;i++){
    let line=lines[i];
    const h=HEAD_ONLY.exec(line);
    if(h&&!chordTokens(line)){out.push("{"+label(h[1])+"}");continue}
    const ct=chordTokens(line);
    if(ct){
      const nx=lines[i+1];
      if(nx!=null&&nx.trim()&&!chordTokens(nx)&&!HEAD_ONLY.test(nx)&&!/\[[^\]]+\]/.test(nx)){
        let ly=nx;const pre=HEAD_PREFIX.exec(ly);let head=null;
        if(pre){head=label(pre[1]);ly=" ".repeat(pre[0].length)+ly.slice(pre[0].length)}
        for(const c of ct.slice().reverse()){
          if(c.pos>ly.length) ly=ly+" ".repeat(c.pos-ly.length);
          ly=ly.slice(0,c.pos)+"["+conv(c.name)+"]"+ly.slice(c.pos);
        }
        if(head) out.push("{"+head+"}");
        out.push(head?ly.trim().replace(/^(\[[^\]]+\])\s+/,"$1"):ly.replace(/\s+$/,"").replace(/^ +(?=\[)/,""));i++;
      } else out.push(ct.map(c=>"["+conv(c.name)+"]").join(" "));
      continue;
    }
    if(english) line=line.replace(/\[([^\]]+)\]/g,(m,c)=>isChord(c)?"["+englishToCzech(c)+"]":m);
    const pre=HEAD_PREFIX.exec(line);
    if(pre&&(/\[/.test(line)||/^(ref|r|rf|chorus)/i.test(pre[1]))){out.push("{"+label(pre[1])+"}");line=line.slice(pre[0].length)}
    out.push(line);
  }
  let text=out.join("\n").replace(/\n{3,}/g,"\n\n").replace(/^\n+|\n+$/g,"");
  // odstraň běžné ocásky webu
  text=text.replace(/\n.*(©|copyright|všechna práva|all rights).*$/gim,"");
  return {title,artist,text,english,chords:chordsIn(text)};
}

return {NOTES,STD,TUNINGS,LEVELS,CHORDS,CATS,ALIAS,DICT,parseChord,isChord,normName,getChord,difficulty,transpose,midiFreq,midiName,chordsIn,chordTokens,importText};
})();
if(typeof module!=="undefined") module.exports=Music;
</script>
<script>(function(){

let ac=null;const cache={};
function ctx(){if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); return ac}
function pluckBuf(midi,dur){
  const key=midi+":"+dur;if(cache[key]) return cache[key];
  const a=ctx(),sr=a.sampleRate,len=Math.floor(sr*dur),buf=a.createBuffer(1,len,sr),d=buf.getChannelData(0);
  const N=Math.max(2,Math.round(sr/M.midiFreq(midi))),decay=midi<50?0.997:0.995;
  for(let i=0;i<N;i++) d[i]=(Math.random()*2-1)*0.5;
  for(let i=N;i<len;i++) d[i]=decay*0.5*(d[i-N]+d[i-N+1]);
  return cache[key]=buf;
}
function pluck(midi,when,dur,gain){const a=ctx(),s=a.createBufferSource(),g=a.createGain();s.buffer=pluckBuf(midi,dur);g.gain.value=gain;s.connect(g).connect(a.destination);s.start(when)}
function strumAt(ch,t,dir,gain){
  if(!ch) return;const idx=[0,1,2,3,4,5].filter(i=>ch.frets[i]>=0);
  const order=dir==="U"?idx.slice().reverse().slice(0,4):idx;
  order.forEach((i,k)=>pluck(M.STD[i]+ch.frets[i],t+k*(dir==="U"?0.018:0.03),1.8,(gain||0.3)*(dir==="U"?0.7:1)));
}
function strum(ch){if(ch) strumAt(ch,ctx().currentTime+0.02,"D",0.32)}
function click(t,acc){const a=ctx(),o=a.createOscillator(),g=a.createGain();o.frequency.value=acc?1600:1000;
  g.gain.setValueAtTime(acc?0.5:0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);o.connect(g).connect(a.destination);o.start(t);o.stop(t+0.06)}

function diagram(ch,opt){
  opt=opt||{};
  if(!ch) return '<svg viewBox="0 0 110 132"><text x="55" y="70" text-anchor="middle" font-size="10" fill="var(--muted)">neznám tvar</text></svg>';
  const L=prefs.lefty,col=i=>L?5-i:i;
  const used=ch.frets.filter(f=>f>0),max=Math.max(0,...used),min=used.length?Math.min(...used):0;
  const base=max>4?min:1,X0=17,DX=15.2,Y0=30,DY=19,n=5;
  let s=`<svg viewBox="0 0 110 ${opt.mini?128:142}" role="img" aria-label="Hmatník akordu ${esc(ch.name)}">`;
  s+=`<rect x="${X0}" y="${Y0}" width="${DX*5}" height="${DY*n}" fill="var(--surface-2)" rx="2"/>`;
  if(base===1) s+=`<rect x="${X0-1}" y="${Y0-3}" width="${DX*5+2}" height="4" fill="var(--fg)" rx="1"/>`;
  else s+=`<text x="${L?X0+DX*5+6:X0-6}" y="${Y0+DY/2+4}" text-anchor="${L?"start":"end"}" font-size="10" fill="var(--muted)">${base}</text>`;
  for(let i=1;i<=n;i++) s+=`<line x1="${X0}" x2="${X0+DX*5}" y1="${Y0+i*DY}" y2="${Y0+i*DY}" stroke="var(--fret)" stroke-width="1.4"/>`;
  for(let i=0;i<6;i++) s+=`<line x1="${X0+col(i)*DX}" x2="${X0+col(i)*DX}" y1="${Y0}" y2="${Y0+DY*n}" stroke="var(--string)" stroke-width="${1.6-i*0.15}"/>`;
  if(ch.barre){const [bf,a,b]=ch.barre,y=Y0+(bf-base+0.5)*DY,x1=X0+Math.min(col(a),col(b))*DX,x2=X0+Math.max(col(a),col(b))*DX;
    s+=`<rect x="${x1-6}" y="${y-6}" width="${x2-x1+12}" height="12" rx="6" fill="var(--accent)"/>`}
  ch.frets.forEach((f,i)=>{const x=X0+col(i)*DX;
    if(f<0) s+=`<text x="${x}" y="${Y0-8}" text-anchor="middle" font-size="11" fill="var(--muted)">×</text>`;
    else if(f===0) s+=`<circle cx="${x}" cy="${Y0-11}" r="3.6" fill="none" stroke="var(--muted)" stroke-width="1.3"/>`;
    else if(!(ch.barre&&f===ch.barre[0]&&i>=ch.barre[1]&&i<=ch.barre[2])) s+=`<circle cx="${x}" cy="${Y0+(f-base+0.5)*DY}" r="6" fill="var(--accent)"/>`;
  });
  if(!opt.mini) ["E","A","D","G","H","e"].forEach((nm,i)=>s+=`<text x="${X0+col(i)*DX}" y="${Y0+DY*n+14}" text-anchor="middle" font-size="9" fill="var(--muted)">${nm}</text>`);
  return s+"</svg>";
}

const docs=new Map();let col=null,mode="local";const LS="prazec-v1";
function lsLoad(){try{const o=JSON.parse(localStorage.getItem(LS)||"{}");Object.entries(o).forEach(([k,v])=>docs.set(k,v))}catch(e){}}

const pending={};
function put(id,data){
  docs.set(id,data);render();
  if(mode!=="db"){lsSave();return}
  if(pending[id]){pending[id].next=data;return}
  pending[id]={next:null};
  const run=d=>col.doc(id).set(d).catch(()=>toast("Uložení se nepovedlo, zkus to znovu")).finally(()=>{const p=pending[id];if(p&&p.next){const n=p.next;p.next=null;run(n)}else delete pending[id]});
  run(data);
}
function del(id){docs.delete(id);render();if(mode==="db") col.doc(id).delete().catch(()=>toast("Smazání se nepovedlo"));else lsSave()}

async function initStore(){
  lsLoad();
  try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist()}catch(e){}
  if(!IS_ARTIFACT){
    if(!localStorage.getItem("prazec-seeded")){try{localStorage.setItem("prazec-seeded","1")}catch(e){}
      if(![...docs.values()].some(d=>d&&d.kind==="song")){docs.set("song-ukazka",EXAMPLE);lsSave()}}
    note("Uloženo v telefonu");$("storeInfo").textContent="Data jsou uložená jen v tomhle zařízení a prohlížeči. Občas si stáhni zálohu, ať o nic nepřijdeš.";
    render();return;
  }
  render();
  const timer=setTimeout(()=>{if(mode!=="db") note("Uloženo v prohlížeči")},10000);
  try{
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    const uid=u?await u.id():null;
    if(!d||!uid){clearTimeout(timer);note("Uloženo v prohlížeči");return}
    col=d.collection("data/users/"+uid);let first=true;
    col.onSnapshot(snap=>{
      clearTimeout(timer);
      if(first){first=false;const local=new Map(docs);snap.docs.forEach(s=>local.delete(s.id));local.forEach((v,k)=>col.doc(k).set(v).catch(()=>{}))}
      mode="db";docs.clear();snap.docs.forEach(s=>{if(s.exists) docs.set(s.id,s.data())});
      Object.keys(pending).forEach(k=>{if(pending[k].next) docs.set(k,pending[k].next)});
      note("Uloženo ve tvém účtu");$("storeInfo").textContent="Data jsou uložená ve tvém účtu Claude a vidíš je jen ty.";render();
    },()=>{clearTimeout(timer);mode="local";note("Uloženo v prohlížeči")});
  }catch(e){clearTimeout(timer);note("Uloženo v prohlížeči")}
}

let mic=null,raf=0,smooth=null,lastHeard=0;
$("micBtn").onclick=()=>mic?stopMic():startMic();
async function startMic(){
  $("micMsg").hidden=true;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error("none");
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const a=ctx(),src=a.createMediaStreamSource(stream),an=a.createAnalyser();an.fftSize=4096;src.connect(an);
    mic={stream,an,buf:new Float32Array(an.fftSize)};$("micBtn").textContent="Vypnout mikrofon";tInfo.textContent="Poslouchám, brnkni na strunu";loop();
  }catch(e){
    $("micMsg").hidden=false;
    $("micMsg").textContent=IS_ARTIFACT?"V náhledu na claude.ai mikrofon nefunguje. V aplikaci nainstalované do telefonu ano. Zatím laď podle sluchu: zapni Opakovat tón a toč kolíčkem, dokud se zvuky nepřestanou chvět."
      :"Mikrofon se nepodařilo zapnout. Povol ho v nastavení prohlížeče pro tuhle stránku a zkus to znovu.";
  }
}
function stopMic(){if(!mic) return;cancelAnimationFrame(raf);mic.stream.getTracks().forEach(t=>t.stop());mic=null;$("micBtn").textContent="Zapnout mikrofon";document.querySelectorAll(".str").forEach(x=>x.classList.remove("target"))}
function detect(b,sr){
  let rms=0;for(let i=0;i<b.length;i++) rms+=b[i]*b[i];rms=Math.sqrt(rms/b.length);if(rms<0.008) return -1;
  // YIN
  const W=Math.floor(b.length/2),maxT=Math.min(W,Math.ceil(sr/65)),d=new Float32Array(maxT);
  for(let t=1;t<maxT;t++){let s=0;for(let i=0;i<W;i++){const x=b[i]-b[i+t];s+=x*x}d[t]=s}
  let run=0;d[0]=1;for(let t=1;t<maxT;t++){run+=d[t];d[t]=d[t]*t/(run||1)}
  let tau=-1;for(let t=Math.floor(sr/1000);t<maxT;t++){if(d[t]<0.12){while(t+1<maxT&&d[t+1]<d[t]) t++;tau=t;break}}
  if(tau<0) return -1;
  const x0=d[tau-1]||d[tau],x2=d[tau+1]||d[tau],den=2*(2*d[tau]-x2-x0);
  return sr/(den?tau+(x2-x0)/den:tau);
}
function loop(){
  if(!mic) return;mic.an.getFloatTimeDomainData(mic.buf);
  const f=detect(mic.buf,ac.sampleRate),now=performance.now();
  if(f>60&&f<1100){
    lastHeard=now;const midi=69+12*Math.log2(f/440);
    smooth=smooth==null||Math.abs(midi-smooth)>0.7?midi:smooth*0.8+midi*0.2;
    const t=tun();let si=0;t.midi.forEach((m,i)=>{if(Math.abs(m-smooth)<Math.abs(t.midi[si]-smooth)) si=i});
    const sc=Math.round((smooth-t.midi[si])*100);
    tNote.textContent=t.names[si];
    tInfo.textContent=`${f.toFixed(1)} Hz · slyším ${M.NOTES[Math.round(smooth)%12]} · ${sc>0?"+":""}${sc} centů`;
    const ok=Math.abs(sc)<=4;
    tHint.textContent=ok?"Naladěno":Math.abs(sc)>100?(sc<0?"Hodně nízko, přitáhni":"Hodně vysoko, povol"):(sc<0?"Přitáhni":"Povol");
    tHint.style.color=ok?"var(--lv3)":"var(--fg)";
    setNeedle(sc);needle.setAttribute("stroke",ok?"var(--lv3)":"var(--accent)");
    document.querySelectorAll(".str").forEach(x=>x.classList.toggle("target",+x.dataset.s===si));
  } else if(now-lastHeard>1500){smooth=null;tHint.textContent="";}
  raf=requestAnimationFrame(loop);
}

function renderLyrics(text,st){
  return (text||"").split("\n").map(line=>{
    const h=/^\s*\{(.+)\}\s*$/.exec(line);if(h) return `<div class="line head">${esc(h[1])}</div>`;
    if(!line.trim()) return `<div class="line nochords">&nbsp;</div>`;
    const parts=line.split(/\[([^\]]+)\]/);let html="",has=parts.length>1;
    if(parts[0]) html+=`<span class="seg"><span class="ch"></span><span class="ly">${esc(parts[0])}</span></span>`;
    for(let i=1;i<parts.length;i+=2){const raw=parts[i].trim();
      if(!M.isChord(raw)){html+=`<span class="seg"><span class="ch"></span><span class="ly">[${esc(raw)}]${esc(parts[i+1]||"")}</span></span>`;continue}

function songCost(chords,shift){return chords.reduce((s,c)=>{const n=M.transpose(c,shift),ch=M.getChord(n),st=chordStat(ch&&M.DICT[n]?n:n);
  let d=M.difficulty(ch);if(st.rating===3) d*=0.6;else if(st.rating===0) d*=1.3;return s+d},0)}
function bestCapo(s){
  const orig=M.chordsIn(s.text);if(!orig.length) return null;
  const keyShift=trans+(+s.capo||0);let best={k:capo,cost:songCost(orig,keyShift-capo)};
  for(let k=0;k<=7;k++){const c=songCost(orig,keyShift-k);if(c<best.cost-0.5) best={k,cost:c}}

  const shapes=[...new Set(orig.map(c=>M.transpose(c,keyShift-best.k)))];
  return {k:best.k,shapes};
}

let scrolling=false,scrollRaf=0,scrollLast=0,scrollAcc=0;
function fab(show){
  let f=$("scrollFab");
  if(!f){f=document.createElement("div");f.id="scrollFab";f.className="scroll-fab";f.setAttribute("role","group");f.setAttribute("aria-label","Posouvání textu");document.body.appendChild(f);
    f.addEventListener("click",e=>{const b=e.target.closest("button");if(!b) return;
      if(b.dataset.sp){prefs.scroll=Math.max(1,Math.min(9,prefs.scroll+ +b.dataset.sp));savePrefs();fab(true)}else{scrolling?stopScroll():startScroll()}})}
  f.hidden=!show||view!=="pisnicky";
  f.innerHTML=`<button type="button" data-sp="-1" aria-label="Pomaleji">−</button><span>${prefs.scroll}</span><button type="button" data-sp="1" aria-label="Rychleji">+</button><button type="button" class="go" aria-label="${scrolling?"Zastavit posouvání":"Spustit posouvání"}">${scrolling?"❚❚":"▶"}</button>`;
}
function startScroll(){scrolling=true;scrollLast=performance.now();scrollAcc=0;fab(true);requestWake();
  const step=t=>{if(!scrolling) return;const dt=(t-scrollLast)/1000;scrollLast=t;scrollAcc+=dt*prefs.scroll*7;
    if(scrollAcc>=1){const px=Math.floor(scrollAcc);scrollAcc-=px;window.scrollBy(0,px)}practiceSec(dt);
    if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-2){stopScroll();return}
    scrollRaf=requestAnimationFrame(step)};scrollRaf=requestAnimationFrame(step)}
function stopScroll(){if(!scrolling) return;scrolling=false;cancelAnimationFrame(scrollRaf);if($("scrollFab")) fab(view==="pisnicky"&&!!sel&&editing==null)}

function htmlToSong(html,url){
  const doc=new DOMParser().parseFromString(html,"text/html");
  const meta=(doc.querySelector('meta[property="og:title"]')||{}).content||(doc.querySelector("title")||{}).textContent||"";
  // Ultimate Guitar: obsah v JSON
  const un=html.replace(/&quot;/g,'"');const ug=/"content":"((?:[^"\\]|\\.)*?\[ch\](?:[^"\\]|\\.)*?)"/.exec(un);
  if(ug){try{const raw=JSON.parse('"'+ug[1]+'"').replace(/\[ch\]([^\[]*?)\[\/ch\]/g,"$1").replace(/\[\/?tab\]/g,"");const r=M.importText(raw,{title:meta});r.rawText=raw;r.meta=meta;return r}catch(e){}}
  doc.querySelectorAll("script,style,noscript,nav,header,footer,form,iframe,svg,button,select").forEach(n=>n.remove());
  doc.querySelectorAll("sup,b,strong,span,a,i,em,[class*=chord],[class*=akord],[class*=Chord]").forEach(n=>{
    if(n.children.length) return;const t=n.textContent.trim();
    const cls=(n.className||"")+"";
    if(t&&M.isChord(t)&&(n.tagName==="SUP"||/chord|akord|ch\b|acc/i.test(cls))) n.replaceWith(doc.createTextNode("["+t+"]"));
  });
  doc.querySelectorAll("br").forEach(n=>n.replaceWith(doc.createTextNode("\n")));
  doc.querySelectorAll("p,div,li,h1,h2,h3,h4,tr,pre,section,article").forEach(n=>n.appendChild(doc.createTextNode("\n")));
  const pres=[...doc.querySelectorAll("pre")].map(p=>p.textContent).filter(t=>t.split("\n").some(l=>M.chordTokens(l)||/\[[A-H][^\]]*\]/.test(l)));
  let text;
  if(pres.length) text=pres.sort((a,b)=>b.length-a.length)[0];
  else{
    // blok s nejvíc akordy
    let best=null,bs=0;doc.querySelectorAll("main,article,section,div,td").forEach(n=>{const t=n.textContent;const c=(t.match(/\[[A-H][^\]\n]{0,7}\]/g)||[]).length+t.split("\n").filter(l=>M.chordTokens(l)).length*3;
      const score=c*1000-t.length/50;if(c>0&&score>bs){bs=score;best=t}});
    text=best||(doc.body?doc.body.textContent:"");
  }
  const r=M.importText(text,{title:meta.trim()});r.rawText=text;r.meta=meta.trim();return r;
}
async function fetchUrl(url){
  try{const r=await fetch(url,{mode:"cors",credentials:"omit"});if(r.ok){const t=await r.text();if(t.length>200) return t}}catch(e){}
  const r=await fetch("https://r.jina.ai/"+url,{headers:{"X-Return-Format":"html"}});
  if(!r.ok) throw new Error("http "+r.status);return await r.text();
}

let dcat="zaklad",cur=null,t0=0,tInt=null,sess={c:0,n:0};
function pick(){
  const pool=M.CHORDS.filter(c=>dcat==="vse"||c[2]===dcat).map(c=>c[0]).filter(n=>n!==cur);
  const w=pool.map(n=>{const s=chordStat(n);return 1+(3-(s.rating==null?1:s.rating))*2+(s.attempts?(1-s.clean/s.attempts)*3:2)});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0) return pool[i]}return pool[0];
}

/* přechody */
let pa=null,pb=null,pRun=null;
function weakest(){const s=M.CHORDS.filter(c=>c[2]==="zaklad").map(c=>c[0]).sort((a,b)=>{const x=chordStat(a).rating,y=chordStat(b).rating;return (x==null?1.5:x)-(y==null?1.5:y)});return [s[0],s[1]]}
const pairId=(a,b)=>"pair-"+idOf(a)+"-"+idOf(b);
function stopPair(silent){if(!pRun) return;clearInterval(pRun.int);pRun=null;if(!silent) render()}
function renderPair(P){
  if(!pa){[pa,pb]=weakest()}
  const opts=n=>M.CHORDS.map(c=>`<option${c[0]===n?" selected":""}>${c[0]}</option>`).join("");
  const rec=docs.get(pairId(pa,pb))||{best:0,hist:[]};
  const running=!!pRun;
  P.innerHTML=`<div style="display:grid;gap:14px">
    <p class="muted">Za minutu přehmatni mezi dvěma akordy co nejvíckrát. Každou čistou změnu odklepni. Přes 30 změn za minutu je skvělé.</p>
    <div class="pair"><div style="display:grid;gap:6px;justify-items:center"><select id="pA" aria-label="První akord"${running?" disabled":""}>${opts(pa)}</select><div class="dg" data-play="${pa}">${diagram(M.DICT[pa])}</div></div>
      <span style="font-size:1.6rem" aria-hidden="true">⇄</span>
      <div style="display:grid;gap:6px;justify-items:center"><select id="pB" aria-label="Druhý akord"${running?" disabled":""}>${opts(pb)}</select><div class="dg" data-play="${pb}">${diagram(M.DICT[pb])}</div></div></div>
    <div class="countdown" id="pCd">${running?pRun.left:60} s</div>
    <button class="big-tap" type="button" id="pTap">${running?`<b id="pCount">${pRun.n}</b>Změna!`:`<span>Start</span>`}</button>
    <p class="muted small-t" style="text-align:center">Rekord ${esc(pa)} ⇄ ${esc(pb)}: <b>${rec.best||0}</b> změn${rec.hist&&rec.hist.length?` · naposledy ${rec.hist[rec.hist.length-1].n}`:""}</p>
  </div>`;
  $("pA").onchange=e=>{pa=e.target.value;render()};$("pB").onchange=e=>{pb=e.target.value;render()};
  $("pTap").onclick=()=>{
    if(!pRun){pRun={n:0,left:60,int:setInterval(()=>{pRun.left--;practiceSec(1);const c=$("pCd");if(c) c.textContent=pRun.left+" s";if(pRun.left<=0) finishPair()},1000)};ctx();render();return}
    pRun.n++;const c=$("pCount");if(c) c.textContent=pRun.n;if(navigator.vibrate) navigator.vibrate(8)};
}
function finishPair(){const n=pRun.n;clearInterval(pRun.int);pRun=null;const id=pairId(pa,pb),rec=docs.get(id)||{kind:"pair",a:pa,b:pb,best:0,hist:[]};
  const hist=[...(rec.hist||[]),{d:today(),n}].slice(-20);const nb=n>(rec.best||0);
  put(id,{kind:"pair",a:pa,b:pb,best:Math.max(rec.best||0,n),hist});logActivity();
  click(ctx().currentTime+0.01,true);toast(nb?`Nový rekord: ${n} změn!`:`${n} změn za minutu`)}
/* metronom */
const PATTERNS=[
  {id:"ctvrt",name:"Čtvrtky dolů",beats:4,slots:"D-D-D-D-"},
  {id:"pop",name:"Pop: D DU UDU",beats:4,slots:"D-DU-UDU"},
  {id:"tabor",name:"Táborák: D DU DU DU",beats:4,slots:"D-DUDUDU"},
  {id:"country",name:"Country: D DU D DU",beats:4,slots:"D-DUD-DU"},
  {id:"osminy",name:"Osminy DUDU",beats:4,slots:"DUDUDUDU"},
  {id:"valcik",name:"Valčík 3/4",beats:3,slots:"D-D-D-"},
  {id:"offbeat",name:"Offbeat (reggae)",beats:4,slots:"-U-U-U-U"},
  {id:"jen",name:"Jen metronom",beats:4,slots:"--------"}
];
let met=null,taps=[];
const pat=()=>PATTERNS.find(p=>p.id===prefs.pattern)||PATTERNS[1];
function progList(){return prefs.prog.split(/[\s,|]+/).filter(Boolean).filter(M.isChord)}
function startMetro(){
  const a=ctx();met={next:a.currentTime+0.1,slot:0,bar:0,timer:null,last:performance.now(),q:[]};
  const sched=()=>{const p=pat(),spb=60/prefs.bpm/2,prog=$("mPlay")&&$("mPlay").checked?progList():[];
    while(met.next<a.currentTime+0.12){
      const s=met.slot,ch=p.slots[s];
      if(s%2===0) click(met.next,s===0);
      if(prog.length&&ch!=="-") strumAt(M.getChord(prog[met.bar%prog.length]),met.next,ch,0.28);
      met.q.push({t:met.next,s,bar:met.bar});
      met.next+=spb;met.slot++;if(met.slot>=p.slots.length){met.slot=0;met.bar++}
    }};
  met.timer=setInterval(sched,25);sched();
  const draw=()=>{if(!met) return;const now=a.currentTime;let ev=null;while(met.q.length&&met.q[0].t<=now) ev=met.q.shift();
    if(ev){document.querySelectorAll(".pattern div").forEach((d,i)=>d.classList.toggle("on",i===ev.s));
      document.querySelectorAll(".beats i").forEach((d,i)=>d.classList.toggle("on",i===Math.floor(ev.s/2)));
      const prog=progList();if(prog.length&&$("mCur")){$("mCur").textContent=prog[ev.bar%prog.length];$("mNext").textContent="další "+prog[(ev.bar+1)%prog.length]}}
    const t=performance.now();practiceSec((t-met.last)/1000);met.last=t;met.raf=requestAnimationFrame(draw)};
  met.raf=requestAnimationFrame(draw);
}
function stopMetro(){if(!met) return;clearInterval(met.timer);cancelAnimationFrame(met.raf);met=null;document.querySelectorAll(".pattern div.on,.beats i.on").forEach(d=>d.classList.remove("on"));if($("mGo")) $("mGo").textContent="Spustit"}
function renderMetro(P){
  const p=pat(),prog=progList();
  P.innerHTML=`<div class="metro">
    <div class="bpm"><b id="mBpm">${prefs.bpm}</b><span class="muted">úderů za minutu</span></div>
    <input type="range" id="mRange" min="40" max="200" value="${prefs.bpm}" aria-label="Tempo">
    <div class="row" style="justify-content:center"><button class="btn small" type="button" data-bpm="-5">−5</button><button class="btn small" type="button" data-bpm="-1">−1</button>
      <button class="btn small" type="button" id="mTap">Ťukni do rytmu</button><button class="btn small" type="button" data-bpm="1">+1</button><button class="btn small" type="button" data-bpm="5">+5</button></div>
    <div class="beats">${Array.from({length:p.beats},(_,i)=>`<i class="${i===0?"acc":""}"></i>`).join("")}</div>
    <label for="mPat">Rytmus úhozů<select id="mPat">${PATTERNS.map(x=>`<option value="${x.id}"${x.id===p.id?" selected":""}>${x.name}</option>`).join("")}</select></label>
    <div class="pattern" style="--n:${p.slots.length}">${[...p.slots].map((c,i)=>`<div><b>${c==="D"?"↓":c==="U"?"↑":""}</b>${i%2?"a":i/2+1}</div>`).join("")}</div>
    <div class="panel"><label class="inline" for="mPlay"><input type="checkbox" id="mPlay"> Hrát se mnou akordy (jeden akord na takt)</label>
      <label for="mProg">Sled akordů<input id="mProg" value="${esc(prefs.prog)}" placeholder="G D Em C"></label>
      <div class="row between"><span style="font-family:var(--f-display);font-size:2.2rem;font-weight:800" id="mCur">${esc(prog[0]||"")}</span><span class="muted" id="mNext">${prog[1]?"další "+esc(prog[1]):""}</span></div></div>
    <button class="btn primary wide" type="button" id="mGo">${met?"Zastavit":"Spustit"}</button></div>`;
  const setB=v=>{prefs.bpm=Math.max(40,Math.min(200,Math.round(v)));savePrefs();$("mBpm").textContent=prefs.bpm;$("mRange").value=prefs.bpm};
  $("mRange").oninput=e=>setB(+e.target.value);
  P.querySelectorAll("[data-bpm]").forEach(b=>b.onclick=()=>setB(prefs.bpm+ +b.dataset.bpm));
  $("mTap").onclick=()=>{const t=performance.now();taps=taps.filter(x=>t-x<2500);taps.push(t);if(taps.length>=3){const iv=(taps[taps.length-1]-taps[0])/(taps.length-1);setB(60000/iv)}};
  $("mPat").onchange=e=>{prefs.pattern=e.target.value;savePrefs();const r=!!met;stopMetro();render();if(r){startMetro();$("mGo").textContent="Zastavit"}};
  $("mProg").onchange=e=>{prefs.prog=e.target.value;savePrefs();const l=progList();$("mCur").textContent=l[0]||"";$("mNext").textContent=l[1]?"další "+l[1]:""};
  $("mGo").onclick=()=>{if(met){stopMetro();flushSec()}else{startMetro();$("mGo").textContent="Zastavit"}};
}
function renderPractice(){
  document.querySelectorAll("#v-cviceni .sub button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===pmode)));
  const P=$("practicePane");
  if(pmode==="drill") renderDrill(P);else if(pmode==="pair") renderPair(P);else if(!P.querySelector(".metro")||!met) renderMetro(P);
}

/* ---------- pokrok ---------- */
function renderProgress(){
  const stats=M.CHORDS.map(([n])=>chordStat(n)),counts=[0,0,0,0];let none=0,att=0,cl=0;
  stats.forEach(s=>{if(s.rating==null) none++;else counts[s.rating]++;att+=s.attempts;cl+=s.clean});
  const lg=getLog(),act=k=>(lg.days[k]||0)+(lg.mins[k]||0);
  let streak=0;for(let d=new Date(),first=true;;d.setDate(d.getDate()-1),first=false){const k=dkey(d);if(act(k)) streak++;else if(!first) break}
  let week=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);week+=lg.mins[dkey(d)]||0}
  const sl=songs().filter(s=>!s.example);
  const dn=n=>n===1?"den":n>=2&&n<=4?"dny":"dní";
  $("stats").innerHTML=[[counts[3],`akordů ti sedí z ${M.CHORDS.length}`],[streak,`${dn(streak)} v řadě`],[Math.round(week/60),"minut cvičení za týden"],[sl.filter(s=>s.status==="umim").length+"/"+sl.length,"písniček umíš"]]
    .map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
  const tot=M.CHORDS.length;
  $("lvBar").innerHTML=counts.map((c,i)=>`<i style="width:${c/tot*100}%;background:var(--lv${i})"></i>`).join("");
  $("lvLegend").innerHTML=counts.map((c,i)=>`<span><i style="background:var(--lv${i})"></i>${M.LEVELS[i]} ${c}</span>`).join("")+`<span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>Neohodnoceno ${none}</span>`;
  const days=[];let mx=1;const ks=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);ks.push(dkey(d))}
  ks.forEach(k=>mx=Math.max(mx,act(k)));
  ks.forEach(k=>{const n=act(k),m=Math.round((lg.mins[k]||0)/60);days.push(`<div title="${fmtDay(k)}: ${m} min, ${lg.days[k]||0} záznamů"${n?` data-n style="--k:${(n/mx).toFixed(2)}"`:""}></div>`)});
  $("days").innerHTML=days.join("");$("dFrom").textContent=fmtDay(ks[0]);
  const focus=stats.filter(s=>s.rating!==3).sort((a,b)=>{const ra=a.rating==null?1.5:a.rating,rb=b.rating==null?1.5:b.rating;return ra-rb||((a.attempts?a.clean/a.attempts:0.5)-(b.attempts?b.clean/b.attempts:0.5))}).slice(0,8);
  $("focus").innerHTML=focus.length?focus.map(s=>`<tr><td><b data-chord="${esc(s.name)}" role="button" tabindex="0" style="cursor:pointer;font-family:var(--f-display)">${esc(s.name)}</b></td>
    <td>${s.rating==null?'<span class="muted">neohodnoceno</span>':`<span class="pill" style="background:var(--lv${s.rating})">${M.LEVELS[s.rating]}</span>`}</td>
    <td class="num">${s.attempts?`${s.clean}/${s.attempts} (${Math.round(s.clean/s.attempts*100)} %)`:"–"}</td><td class="num">${s.last?fmtDay(s.last):"–"}</td></tr>`).join("")
    :`<tr><td colspan="4">Všechny akordy ti sedí. Zkus barré nebo novou písničku.</td></tr>`;
  const pairs=[...docs.values()].filter(d=>d&&d.kind==="pair").sort((a,b)=>b.best-a.best);
  $("pairsBox").innerHTML=pairs.length?`<h3>Přechody za minutu</h3><div class="tbl"><table><thead><tr><th>Přechod</th><th>Rekord</th><th>Naposledy</th><th>Pokusů</th></tr></thead><tbody>${pairs.map(p=>{const l=p.hist[p.hist.length-1]||{};
    return `<tr><td><b>${esc(p.a)} ⇄ ${esc(p.b)}</b></td><td class="num">${p.best}</td><td class="num">${l.n!=null?l.n+" ("+fmtDay(l.d)+")":"–"}</td><td class="num">${p.hist.length}</td></tr>`}).join("")}</tbody></table></div>`:"";
  $("optLefty").checked=prefs.lefty;$("optWake").checked=prefs.wake;
}
$("optLefty").onchange=e=>{prefs.lefty=e.target.checked;savePrefs()};
$("optWake").onchange=e=>{prefs.wake=e.target.checked;savePrefs();if(!prefs.wake) releaseWake()};
$("exportBtn").onclick=async()=>{
  const data=JSON.stringify({app:"prazec",version:1,exported:new Date().toISOString(),docs:Object.fromEntries(docs)},null,1),name=`prazec-zaloha-${today()}.json`;
  if(IS_ARTIFACT){try{const dl=await claude.use("downloads");if(dl){await dl.save({filename:name,data});return}}catch(e){toast("Zálohu se nepodařilo uložit");return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
};
$("importFile").onchange=async e=>{const f=e.target.files[0];if(!f) return;
  try{const o=JSON.parse(await f.text());if(o.app!=="prazec"||!o.docs) throw 0;let n=0;
    Object.entries(o.docs).forEach(([k,v])=>{if(!docs.has(k)||k==="log"||(v.kind==="chord")){put(k,v);n++}});toast(`Nahráno ${n} záznamů`)}
  catch(err){toast("Tohle není záloha z Pražce")}e.target.value=""};
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;$("installBtn").hidden=false});
$("installBtn").onclick=async()=>{if(!installEvt) return;installEvt.prompt();await installEvt.userChoice.catch(()=>{});installEvt=null;$("installBtn").hidden=true};

function render(){
  if(view==="akordy") renderChords();
  else if(view==="pisnicky") renderSongs();
  else if(view==="cviceni") renderPractice();
  else if(view==="pokrok") renderProgress();
  if(view!=="pisnicky"&&$("scrollFab")) $("scrollFab").hidden=true;
}

/* sdílení do aplikace (Android) */
function shareParams(){
  const p=new URLSearchParams(location.search);if(!p.has("text")&&!p.has("url")) return null;
  const text=(p.get("text")||"")+" "+(p.get("url")||"");const url=(text.match(/https?:\/\/\S+/)||[""])[0];
  history.replaceState(null,"",location.pathname+"#pisnicky");
  return {url,text:url?"":text.trim()};
}
renderStrings();route();initStore();
const sp=shareParams();if(sp){location.hash="#pisnicky";route();importSheet(sp)}
})();
</script>
